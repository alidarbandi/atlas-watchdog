[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-watchdog"
version = "0.1.6"
description = "Observational ATLAS log monitor for Windows laboratories"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.8.3", "httpx==0.28.1", "tzdata==2025.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "PyInstaller==6.16.0"]

[project.gui-scripts]
atlas-watchdog = "atlas_watchdog.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

