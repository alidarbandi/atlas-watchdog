name: Windows test and package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Create reproducible environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-lock.txt
          .venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .
      - name: Test and build both formats
        shell: pwsh
        run: .\scripts\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ATLASWatchdog-Windows-x64
          path: dist/
