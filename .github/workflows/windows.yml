name: Windows test and package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v0.1.7 after both profiles pass (main only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: modern
            python: '3.12.13'
            environment: .venv
            lock: requirements-lock.txt
          - profile: legacy
            python: '3.10.11'
            environment: .venv-legacy
            lock: requirements-legacy-lock.txt
    env:
      ATLAS_WATCHDOG_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.profile == 'legacy'
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Set up pinned uv for the modern standalone Python build
        if: matrix.profile == 'modern'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Create reproducible environment
        shell: pwsh
        run: |
          if ('${{ matrix.profile }}' -eq 'modern') {
            uv python install 3.12.13
            if ($LASTEXITCODE -ne 0) { throw 'Pinned modern Python download failed' }
            uv venv --python 3.12.13 --managed-python .venv
            if ($LASTEXITCODE -ne 0) { throw 'Modern environment creation failed' }
            uv pip install --python .venv\Scripts\python.exe -r requirements-lock.txt
            if ($LASTEXITCODE -ne 0) { throw 'Modern locked dependency installation failed' }
            uv pip install --python .venv\Scripts\python.exe --no-deps --no-build-isolation -e .
          } else {
            python -m venv .venv-legacy
            if ($LASTEXITCODE -ne 0) { throw 'Legacy environment creation failed' }
            .venv-legacy\Scripts\python.exe -m pip install -r requirements-legacy-lock.txt
            if ($LASTEXITCODE -ne 0) { throw 'Legacy locked dependency installation failed' }
            .venv-legacy\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .
          }
          if ($LASTEXITCODE -ne 0) { throw 'Application installation failed' }
      - name: Test and build both formats
        shell: pwsh
        run: .\scripts\build.ps1 -Profile ${{ matrix.profile }}
      - name: Packaged demo verification (Server 2022, not target OS certification)
        shell: pwsh
        run: |
          $artifact = if ('${{ matrix.profile }}' -eq 'legacy') { 'ATLASWatchdog-Win10-1607-x64' } else { 'ATLASWatchdog' }
          .\scripts\test-candidate.ps1 -Executable "dist\v0.1.7\${{ matrix.profile }}\$artifact-debug\$artifact-debug.exe"
          .\scripts\test-candidate.ps1 -Executable "dist\v0.1.7\${{ matrix.profile }}\$artifact.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ATLASWatchdog-Windows-x64-${{ matrix.profile }}
          path: dist/v0.1.7/${{ matrix.profile }}/
  release:
    name: Publish verified Windows downloads
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-atlas-watchdog-v0.1.7
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATLASWatchdog-Windows-x64-legacy
          path: dist/v0.1.7/legacy
      - uses: actions/download-artifact@v4
        with:
          name: ATLASWatchdog-Windows-x64-modern
          path: dist/v0.1.7/modern
      - name: Prepare source, standalone executables, legacy folder and checksums
        run: python3 scripts/package_github_release.py --source-commit "$GITHUB_SHA"
      - name: Publish v0.1.7 without replacing existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.1.7 --json isDraft > release-state.json 2>/dev/null; then
            if python3 -c 'import json; raise SystemExit(0 if json.load(open("release-state.json"))["isDraft"] else 1)'; then
              echo 'An existing v0.1.7 draft needs review; no assets were overwritten.' >&2
              exit 1
            fi
            echo 'v0.1.7 is already published; existing assets were preserved.'
            exit 0
          fi
          gh release create v0.1.7 dist/github-v0.1.7/* \
            --target "$GITHUB_SHA" --title 'ATLAS Watchdog v0.1.7 — legacy Windows compatibility' \
            --notes-file docs/release-v0.1.7.md --draft
          gh release edit v0.1.7 --draft=false --latest
